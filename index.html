<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Total drama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
    <h1>Olá, seja bem vindo ao formulário de total drama</h1>
    <h2>Está preparado para entrar num rpg incrível com gente maluca, personagens problemáticos e manipulações contínuas?</h2>
</div>

<div class="formulario">
<form action="">
    <h1>Preencha suas informações</h1>
    <div class="nome">
    <label for="Nome">Nome</label>
    <input id="Nome" type="text" class="block">
</div>

<div class="idade">
    <label for="Idade">Idade</label>
    <input id="Idade" type="number" class="block">
</div>

<div class="background">
    <label for="Desc">Background do seu personagem</label>
    <input id="Desc" type="text">
</div>

<div class="items">
    <label for="items">Itens que serão levadoss</label>
    <input id="items" type="text">
</div>



<div class="carac">
    <input type="radio" value="lutador" name="caracteristicas" id="">
    <label for="caracteristicas">lutador</label>
    <input type="radio" value="fashionista" name="caracteristicas" id="">
    <label for="caracteristicas">fashionista</label>
    <input type="radio" value="terapeuta" name="caracteristicas" id="">
    <label for="caracteristicas">domesticador</label>
    <input type="radio" value="fofo" name="caracteristicas" id="">
    <label for="caracteristicas">fofo</label>
    <input type="radio" value="nadador" name="caracteristicas" id="">
    <label for="caracteristicas">nadador</label>
    <input type="radio" value="tagarela" name="caracteristicas" id="">
    <label for="caracteristicas">tagarela</label>
    <input type="radio" value="bobo da corte" name="caracteristicas" id="">
    <label for="caracteristicas">bobo da corte</label>
    <input type="radio" value="sonolento" name="caracteristicas" id="">
    <label for="caracteristicas">sonolento</label>
    


</div>
</form>
</div>
</body>
</html>
